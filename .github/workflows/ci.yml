name: C++ CI Build and Test
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
 
jobs:
  build-and-test:
    runs-on: ubuntu-latest
 
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
 
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
 
    - name: Compile Tests
      run: |
        g++ -std=c++17 -o test/test_runner test/tests.cpp src/twosum.cpp
 
    - name: Run Tests
      run: |
        ./test/test_runner
 
    - name: Upload Executable as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-runner
        path: test/test_runner
        retention-days: 7