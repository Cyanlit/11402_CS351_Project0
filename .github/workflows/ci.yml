name: C++ CI Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Compile Project
      # Compiling with C++17 as required by your SRS
      run: g++ -std=c++17 -Isrc -o test_runner tests.cpp src/twosum.cpp

    - name: Run Tests
      # Executes the compiled test binary and checks the return code
      run: ./test_runner